spring:
  application:
    name: hello-world
server:
  port: 8080
  servlet:
    context-path: /hello-world

  datasource:
    url: jdbc:h2:mem:bankingdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# Actuator health monitoring
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true